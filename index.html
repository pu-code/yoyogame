<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>勇者試煉｜AI 題庫 RPG</title>
  <style>
    :root{--ink:#2d2540;--paper:#fff9e9;--gold:#f3b631;--violet:#7854a9;--mint:#5fba92;--danger:#df5c65;--shadow:0 8px 0 rgba(46,32,64,.2)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#193d38 url('assets/backgrounds/forest-battle.png') center/cover fixed;overflow-x:hidden}
    button{font:inherit;cursor:pointer;border:0}.game{width:min(1060px,94vw);margin:auto;padding:12px 0 32px}.title{display:block;width:min(620px,88vw);max-height:180px;object-fit:contain;margin:0 auto -30px;position:relative;z-index:3}.hud{position:relative;z-index:2;display:flex;gap:12px;justify-content:space-between;background:rgba(255,249,233,.94);border:3px solid #7b5737;border-radius:18px;padding:14px 18px;box-shadow:var(--shadow)}
    .stat{min-width:0;flex:1;font-weight:800}.stat-line{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}.bar{height:13px;background:#ddd2bd;border-radius:999px;overflow:hidden;margin-top:5px}.fill{height:100%;border-radius:inherit;transition:width .35s}.hp{background:linear-gradient(90deg,#f37770,#d83957)}.enemyhp{background:linear-gradient(90deg,#f6c447,#db7d31)}.coin{display:flex;align-items:center;justify-content:center;color:#86541c;font-size:1.15rem}.coin b{margin-left:5px}
    .stage{display:grid;grid-template-columns:1fr minmax(300px,1.3fr) 1fr;align-items:end;gap:12px;min-height:570px;padding:35px 10px 10px}.sprite{width:100%;max-height:310px;object-fit:contain;filter:drop-shadow(0 12px 7px rgba(20,30,25,.35))}.player{animation:float 2.7s ease-in-out infinite}.enemy{animation:float 2.3s ease-in-out .2s infinite}.enemybox{text-align:center;color:#fff9e9;text-shadow:0 2px 2px #291a2c}.enemybox h2{margin:0;font-size:clamp(1.25rem,3vw,1.8rem)}
    .card{align-self:center;background:rgba(255,250,238,.96);border:4px solid #76513c;border-radius:24px;padding:22px;box-shadow:var(--shadow);text-align:center}.tag{display:inline-block;background:#dcebd9;color:#2d654d;padding:4px 12px;border-radius:99px;font-weight:bold;font-size:.84rem}.question{font-size:clamp(1.04rem,2.3vw,1.28rem);font-weight:800;line-height:1.65;margin:14px 0}.choices{display:grid;gap:9px}.choice{background:#fff;border:2px solid #d5c5ad;border-radius:13px;padding:11px 13px;text-align:left;color:var(--ink);font-weight:700;transition:.18s}.choice:hover,.choice:focus{transform:translateY(-2px);background:#fff3c9;border-color:var(--gold);outline:none}.choice:disabled{cursor:default}.choice.correct{background:#d9f3de;border-color:#4fa66b}.choice.wrong{background:#ffe0dd;border-color:#d85b5d}.feedback{min-height:26px;margin:12px 0 0;font-weight:800;color:#7b4a32}.feedback.good{color:#24734c}.feedback.bad{color:#b83e45}.next{margin-top:12px;background:var(--violet);color:#fff;padding:11px 20px;border-radius:12px;font-weight:bold;box-shadow:0 4px 0 #4b316f}.hidden{display:none!important}
    .modal{position:fixed;inset:0;z-index:10;background:rgba(27,20,41,.67);display:grid;place-items:center;padding:18px}.panel{background:var(--paper);background-size:cover;background-position:center;border:4px solid #745039;border-radius:26px;width:min(720px,96vw);padding:30px;text-align:center;box-shadow:0 14px 0 rgba(20,12,28,.35)}.panel h1{margin:0 0 10px}.panel p{line-height:1.7}.primary{background:linear-gradient(#a984d3,#694396);color:#fff;padding:13px 24px;border-radius:13px;font-weight:800;box-shadow:0 5px 0 #4c2b70}.shop{background-image:linear-gradient(rgba(255,249,233,.82),rgba(255,249,233,.88)),url('assets/backgrounds/shop.png')}.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.item{background:rgba(255,255,255,.9);border:2px solid #a8794e;border-radius:15px;padding:10px}.item img{height:76px;width:100%;object-fit:contain}.item h3{margin:2px 0;font-size:1rem}.buy{background:#efbd40;color:#49331b;padding:8px 10px;border-radius:9px;font-weight:800}.buy:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}.small{font-size:.88rem}.summary{font-size:1.1rem;font-weight:800;background:#fff4d6;padding:10px;border-radius:12px}
    @keyframes float{50%{transform:translateY(-10px) rotate(1deg)}} @media(max-width:700px){.game{width:96vw}.title{margin-bottom:-18px}.hud{padding:10px;font-size:.88rem;gap:7px}.stage{grid-template-columns:1fr 1fr;grid-template-areas:'enemy player' 'card card';min-height:auto;padding-top:28px}.enemybox{grid-area:enemy}.playerbox{grid-area:player}.card{grid-area:card}.sprite{max-height:190px}.question{margin:10px 0}.card{padding:16px}.shop-grid{grid-template-columns:1fr}.item{display:grid;grid-template-columns:85px 1fr;align-items:center;text-align:left}.item img{grid-row:span 3}.item h3,.item p{margin:2px 0}.buy{grid-column:2}}
  </style>
  <style>.map-back{position:fixed;z-index:20;top:14px;left:14px;border:2px solid #8c5938;border-radius:999px;padding:9px 13px;background:#fff7db;color:#5e3823;font:700 15px "Microsoft JhengHei",sans-serif;text-decoration:none;box-shadow:0 3px 0 #c99662}.map-back:hover{transform:translateY(-1px)}</style>
</head>
<body>
<a class="map-back" href="大冒險地圖/index.html">← 回到大地圖</a>
<main class="game">
  <img class="title" src="assets/title.png" alt="勇者試煉" />
  <section class="hud"><div class="stat"><div class="stat-line"><span>魔法師 HP</span><b id="hpText">100 / 100</b></div><div class="bar"><div id="hpBar" class="fill hp" style="width:100%"></div></div></div><div class="stat"><div class="stat-line"><span id="monsterName">野狼 HP</span><b id="monsterHpText">40 / 40</b></div><div class="bar"><div id="monsterBar" class="fill enemyhp" style="width:100%"></div></div></div><div class="coin">🪙 <b id="coins">0</b></div></section>
  <section class="stage"><div class="enemybox"><h2 id="enemyLabel">第一關・野狼</h2><img id="enemySprite" class="sprite enemy" src="assets/characters/wolf.png" alt="野狼" /></div><div id="quizCard" class="card"><span id="progress" class="tag">第 1 / 4 題</span><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="next hidden">下一題</button></div><div class="playerbox"><img class="sprite player" src="assets/characters/wizard-reference.png" alt="可愛魔法師" /></div></section>
</main>
<div id="intro" class="modal"><div class="panel"><h1>魔法師，準備好了嗎？</h1><p>答對題目便可施放魔法攻擊並取得金幣；答錯會損失生命值，但可看見正確答案。<br>依序擊敗野狼、毒蠍、惡鬼、巨龍與魔王，完成勇者試煉！</p><button id="startBtn" class="primary">開始冒險</button></div></div>
<div id="shopModal" class="modal hidden"><div class="panel shop"><h1>關卡商店</h1><p>運用金幣，為下一場戰鬥做好準備。</p><div class="shop-grid"><article class="item"><img src="assets/items/healing-potion.png" alt="回血藥水"><h3>回血藥水</h3><p class="small">回復 35 HP・20 金</p><button class="buy" data-item="heal">購買</button></article><article class="item"><img src="assets/items/attack-crystal.png" alt="攻擊水晶"><h3>攻擊水晶</h3><p class="small">本關攻擊 +8・30 金</p><button class="buy" data-item="attack">購買</button></article><article class="item"><img src="assets/items/revival-charm.png" alt="復活符"><h3>復活符</h3><p class="small">倒下時復活一次・45 金</p><button class="buy" data-item="revive">購買</button></article></div><button id="continueBtn" class="primary">前往下一關</button></div></div>
<div id="endModal" class="modal hidden"><div class="panel"><h1 id="endTitle"></h1><p id="endText"></p><div id="endScore" class="summary"></div><br><button id="restartBtn" class="primary">重新挑戰</button></div></div>
<script>
const questions=[
['政府想分析社群文字與影片，了解民眾對議題的看法；最合適的技術組合是？','語音辨識＋影像生成','文字探勘＋語音合成','自然語言處理＋電腦視覺','推薦系統'],
['智慧工廠要依不同任務選擇合適學習法，下列何者正確？','監督式學習適合有標記的瑕疵分類','非監督式學習無法發現群集','強化學習只能用於影像','非監督式學習可直接精準判定標籤'],
['電商用大量商品圖片自動判斷是否有瑕疵，最核心的 AI 技術是？','自然語言處理','電腦視覺','異常偵測','診斷分析'],
['智慧交通系統即時分析大量資料並自動調整號誌，最核心能力為何？','僅分析新聞情緒','快速處理大數據並即時辨識模式','用 GAN 模擬路況','依個人喜好推薦商品'],
['AI 審核履歷已通過準確性測試，仍須兼顧公平與申訴；最適當作法是？','不公開任何資訊','只提高準確率','進行偏差影響評估並建立申訴機制','忽略申訴以節省成本'],
['國際 AI 管理系統標準常見的可信任 AI 特性中，下列何者不屬於核心面向？','安全','公平','效率','可靠'],
['生成式 AI 新聞摘要的訓練資料，最應注意什麼？','資料來源多元並經內容與偏見檢視','完全不使用國外資料','只使用公司自家新聞','只輸入固定格式'],
['保險 AI 系統在重大權益決定前，透明性最不需要提供什麼？','模型架構與訓練資料細節全面公開','服務範圍與限制','人工覆核或申訴管道','所有決定皆可人工覆核'],
['醫院 AI 發生難以理解判斷、特定族群誤診率較高、病歷誤入訓練集，依序違反？','透明性、公平性、隱私性','隱私性、安全性、公平性','公平性、透明性、問責性','問責性、公平性、隱私性'],
['智慧農業有 5 萬感測器即時資料及多種資料來源，最主要的大數據特性組合是？','Volume 與 Velocity','Variety 與 Veracity','Velocity 與 Value','Volume 與 Value'],
['信用風險模型中把職業類別當輸入特徵，最主要的倫理風險是？','資料格式不一致','特徵缺失','可能加劇特定族群偏見','模型會更有效率'],
['ERP 訂單、感測器數值、維修報告 PDF 文字，依序屬於？','非結構化、半結構化、非結構化','結構化、半結構化、非結構化','結構化、非結構化、半結構化','全是結構化'],
['職業欄位有工程師、教師、業務、自由業；何種編碼最可能造成模型誤解職業有大小順序？','One-Hot Encoding','Binary Encoding','Target Encoding','Label Encoding'],
['以 5-fold 交叉驗證訓練電力需求預測模型，主要限制是？','一定不能用於三年以上資料','可能混入未來時間點資料造成洩漏','資料切分過少只可用 10-fold','只適用影像問題'],
['以年齡、體重、血糖等特徵訓練時，哪個模型對尺度最不敏感、通常可不標準化？','線性迴歸','支援向量機','K 近鄰','決策樹'],
['從設備感測資料即時找出與正常狀況顯著不同的訊號並預警，是？','客群分群','需求預測','KPI 儀表板','異常偵測'],
['提供去識別的叫車資料給研究機構，保留叫車時間與上車地點；最符合去識別要求的作法？','只移除姓名','用 MD5 雜湊且保留可查對照表','彙總成每區每小時趟次統計','以假名取代原姓名並保留完整資料'],
['感測器時間序列有 5% 缺值，確認為訊號遺失且非設備異常；最合適補值方式？','全部補為 0','以前後時間點加權平均補值','填入整體平均','刪除所有含缺值時間點'],
['異常偵測模型漏掉 10 個真實異常；最需要優先關注的指標？','召回率 Recall','精確率 Precision','準確率 Accuracy','F1 分數'],
['跨國傳輸敏感資料進行模型訓練，在不顯著影響即時傳輸效率下，何者最能降低風險？','提高影像解析度','傳輸中加密並確認資料來源','分散到更多未加密節點','採用紙本傳遞']
].map(([q,a,b,c,d],i)=>({q,options:[a,b,c,d],answer:[2,0,1,1,2,2,0,0,0,0,2,1,3,1,3,3,2,1,0,1][i]}));
const monsters=[{name:'野狼',img:'wolf.png',hp:40,hit:14,reward:12},{name:'毒蠍',img:'scorpion.png',hp:48,hit:17,reward:15},{name:'惡鬼',img:'oni.png',hp:58,hit:20,reward:18},{name:'巨龍',img:'dragon.png',hp:68,hit:23,reward:22},{name:'魔王',img:'demon-king.png',hp:78,hit:27,reward:30}];
let state;
const $=s=>document.querySelector(s); function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function reset(){state={stage:0,index:0,hp:100,coins:0,damage:20,revive:false,correct:0,answered:false,deck:shuffle(questions)}; $('#intro').classList.add('hidden'); $('#endModal').classList.add('hidden'); loadStage();}
function loadStage(){let m=monsters[state.stage];state.monsterHp=m.hp;state.index=0;state.attackBonus=0;$('#monsterName').textContent=m.name+' HP';$('#enemyLabel').textContent=`第 ${state.stage+1} 關・${m.name}`;$('#enemySprite').src='assets/characters/'+m.img;$('#enemySprite').alt=m.name;$('#quizCard').classList.remove('hidden');render();}
function update(){let m=monsters[state.stage];$('#hpText').textContent=`${state.hp} / 100`;$('#hpBar').style.width=state.hp+'%';$('#monsterHpText').textContent=`${Math.max(0,state.monsterHp)} / ${m.hp}`;$('#monsterBar').style.width=Math.max(0,state.monsterHp/m.hp*100)+'%';$('#coins').textContent=state.coins}
function render(){let q=state.deck[state.stage*4+state.index];state.answered=false;$('#progress').textContent=`第 ${state.index+1} / 4 題`;$('#question').textContent=q.q;let opts=shuffle(q.options.map((x,i)=>({x,i})));$('#choices').innerHTML=opts.map(o=>`<button class="choice" data-i="${o.i}">${'ABCD'[o.i]}. ${o.x}</button>`).join('');$('#feedback').textContent='';$('#feedback').className='feedback';$('#nextBtn').classList.add('hidden');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i));update();}
function answer(i){if(state.answered)return;state.answered=true;let q=state.deck[state.stage*4+state.index],m=monsters[state.stage],buttons=document.querySelectorAll('.choice');buttons.forEach(b=>{b.disabled=true;if(+b.dataset.i===q.answer)b.classList.add('correct')});if(i===q.answer){let dmg=state.damage+state.attackBonus;state.monsterHp-=dmg;state.coins+=m.reward;state.correct++;$('#feedback').textContent=`答對！魔法命中，造成 ${dmg} 點傷害，獲得 ${m.reward} 金幣。`;$('#feedback').classList.add('good')}else{buttons.forEach(b=>{if(+b.dataset.i===i)b.classList.add('wrong')});state.hp-=m.hit;$('#feedback').textContent=`答錯！正確答案是：${q.options[q.answer]}。你受到 ${m.hit} 點傷害。`;$('#feedback').classList.add('bad');if(state.hp<=0){if(state.revive){state.revive=false;state.hp=45;$('#feedback').textContent+=' 復活符發光了！你以 45 HP 重返戰場。'}else{return setTimeout(()=>finish(false),600)}}}update();$('#nextBtn').classList.remove('hidden')}
$('#nextBtn').onclick=()=>{if(state.monsterHp<=0){update();$('#quizCard').classList.add('hidden');if(state.stage===4)finish(true);else $('#shopModal').classList.remove('hidden')}else if(state.index===3){state.index=0;render()}else{state.index++;render()}};
document.querySelectorAll('.buy').forEach(btn=>btn.onclick=()=>{let kind=btn.dataset.item,cost={heal:20,attack:30,revive:45}[kind];if(state.coins<cost)return;if(kind==='heal'){if(state.hp===100)return;state.hp=Math.min(100,state.hp+35)}if(kind==='attack')state.attackBonus+=8;if(kind==='revive')state.revive=true;state.coins-=cost;btn.disabled=true;update()});
$('#continueBtn').onclick=()=>{$('#shopModal').classList.add('hidden');state.stage++;loadStage()};
function finish(win){if(win)localStorage.setItem('cert_warrior','true');$('#endTitle').textContent=win?'🏆 勇者試煉完成！':'挑戰暫時失敗';$('#endText').textContent=win?'你以知識與勇氣打敗了魔王！':'魔法師倒下了，但每一次練習都會更強。';$('#endScore').textContent=`答對 ${state.correct} / 20 題・金幣 ${state.coins}・剩餘 HP ${Math.max(0,state.hp)}`;$('#endModal').classList.remove('hidden')}
$('#startBtn').onclick=reset;$('#restartBtn').onclick=reset;
</script></body></html>
