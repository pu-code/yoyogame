<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>星印遠征：三印之門</title>
<style>
:root{--ink:#24334a;--red:#d95a5a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#182c43;color:var(--ink)}.map-page{min-height:100vh;display:grid;place-items:center;padding:16px}.map-frame{position:relative;width:min(100%,calc(177.77vh - 57px));aspect-ratio:16/9;max-width:1920px;max-height:calc(100vh - 32px);overflow:hidden;border-radius:18px;box-shadow:0 12px 36px #0008;background:#233a4e}.map-bg{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain}.info{position:absolute;z-index:4;top:2.1%;right:1.5%;display:flex;align-items:center;gap:.55em;border:2px solid #896032;border-radius:999px;padding:.42em .65em .42em .85em;background:#fff8dbe8;color:#59401f;font-weight:bold;box-shadow:0 3px 0 #a87e46;font-size:clamp(11px,1.15vw,17px)}.clear{border:0;border-radius:999px;padding:.45em .7em;background:#e8a64c;color:#fff;font:inherit;font-weight:bold;cursor:pointer}.clear:hover{filter:brightness(1.08)}.hotspot{position:absolute;z-index:2;border:0;border-radius:9px;cursor:pointer;background:#fff0;transition:background .18s,box-shadow .18s;outline:none}.hotspot:hover,.hotspot:focus-visible{background:#fff5;box-shadow:0 0 0 3px #fff9,0 0 18px 7px #ffd45b99}.hotspot.done:after{content:"✓";position:absolute;right:4%;top:-28%;display:grid;place-items:center;width:28%;aspect-ratio:1;border-radius:50%;background:#3da75c;color:#fff;border:2px solid #e8ffdf;box-shadow:0 2px 0 #20743d;font-weight:900;font-size:clamp(14px,2vw,30px);transform:rotate(10deg)}.dynasty{left:13.8%;top:36.9%;width:16%;height:9.4%}.idiom{left:70.5%;top:38.5%;width:16.3%;height:9.5%}.gate-hotspot{left:41.7%;top:66.1%;width:16.8%;height:10.3%}.warrior{left:65.2%;top:84.5%;width:17.5%;height:10%}.cover{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:#101b2b;cursor:pointer;transition:opacity .75s ease,visibility .75s ease}.cover.hide{opacity:0;visibility:hidden;pointer-events:none}.cover img{display:block;width:100%;height:100%;object-fit:contain;max-width:100%;max-height:100vh}.modal{position:fixed;inset:0;z-index:20;padding:20px;display:grid;place-items:center;background:#17233db8;opacity:0;pointer-events:none;transition:.2s}.modal.open{opacity:1;pointer-events:auto}.dialog{width:min(760px,100%);max-height:92vh;overflow:auto;position:relative;padding:28px;background:#fffaf0;border:5px solid #e0ae5d;border-radius:24px;box-shadow:0 15px 42px #0006}.close{position:absolute;right:13px;top:10px;border:0;background:none;font-size:1.8rem;cursor:pointer;color:#77522d}.dialog h2{text-align:center;margin:0 34px 8px;font-size:1.65rem}.dialog>p{text-align:center;margin:0 0 21px}.slots{display:grid;gap:12px;margin-bottom:24px}.slot{min-height:84px;border:3px dashed #b19061;border-radius:14px;display:flex;align-items:center;gap:17px;padding:10px 17px;background:#f4ead6;transition:.18s}.slot.over{border-color:#477fc5;background:#e5f2ff}.slot.correct{border-style:solid;border-color:#2a9c56;background:#dff7e5}.slot.wrong{animation:shake .35s;border-color:var(--red);background:#ffe3e3}.slot-label{min-width:4em;font-weight:bold;color:#76552d}.slot-empty{color:#9c8568;font-size:.93rem}.backpack{border-top:2px solid #ead4aa;padding-top:17px}.backpack h3{margin:0 0 10px}.bag{display:flex;gap:12px;flex-wrap:wrap;min-height:78px}.badge{display:inline-flex;align-items:center;gap:7px;border:2px solid #d59838;border-radius:12px;padding:10px 13px;color:#714819;background:#fff0bd;font-weight:bold;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 0 #d6a44d}.badge:active{cursor:grabbing}.badge.used{display:none}.badge.dragging{position:fixed;z-index:40;pointer-events:none;opacity:.9;transform:rotate(5deg)}.empty{color:#917e65}.complete{text-align:center;padding:14px 5px}.complete .trophy{font-size:4.5rem;margin:8px}.again{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:12px 20px;background:#e6923d;color:white;cursor:pointer;font-size:1.08rem}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(max-width:650px){.map-page{padding:8px}.map-frame{width:min(100%,calc(177.77vh - 29px));border-radius:9px}.info{font-size:10px;padding:.38em .45em .38em .65em;gap:.3em}.clear{padding:.38em .5em}.hotspot.done:after{border-width:1px}.dialog{padding:26px 17px}.slot{padding:9px 11px;gap:9px}}
</style><style>.ending-modal{position:fixed;z-index:28;inset:0;display:grid;place-items:center;padding:16px;background:#0b1425e8;opacity:0;pointer-events:none;transition:opacity .35s}.ending-modal.open{opacity:1;pointer-events:auto}.ending-scene{position:relative;width:min(100%,calc(177.77vh - 57px));aspect-ratio:16/9;overflow:hidden;border-radius:16px;box-shadow:0 15px 45px #000b;background:#14233b}.ending-scene img{display:block;width:100%;height:100%;object-fit:contain}.ending-copy{position:absolute;inset:auto 0 0;padding:6% 8% 5%;text-align:center;color:#fff;background:linear-gradient(transparent,#101a2bdd);text-shadow:0 2px 4px #000;font-size:clamp(1rem,2.2vw,1.65rem);font-weight:bold;letter-spacing:.08em}.ending-next{margin-top:1em;border:2px solid #fff7c0;border-radius:999px;padding:.55em 1.25em;background:#c67b39;color:#fff;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #70401f}.ending-step{position:absolute;top:3%;left:4%;padding:.35em .75em;border-radius:999px;background:#17233db8;color:#fff;font-size:clamp(.7rem,1.2vw,1rem)}@media(max-width:650px){.ending-scene{width:min(100%,calc(177.77vh - 29px));border-radius:9px}.ending-copy{padding:8% 5% 5%;font-size:.9rem}.ending-next{margin-top:.7em}}</style></head><body>
<main class="map-page" aria-label="大冒險地圖"><section class="map-frame"><img class="map-bg" src="map-bg.png" alt="童話繪本風格的大冒險地圖，包含時光卷軸庭、墨語書院、三印星門與勇者試煉城。"><div class="info">持有 <b id="count">0</b> / 3 <button class="clear" id="clearProgress">🔄 清除進度</button></div><a class="hotspot dynasty" data-cert="cert_dynasty" href="../示範1_朝代配對/index.html" aria-label="前往時光卷軸庭：朝代配對"></a><a class="hotspot idiom" data-cert="cert_idiom" href="../示範2_成語填字/index.html" aria-label="前往墨語書院：成語填字"></a><button class="hotspot gate-hotspot" id="gateBtn" aria-label="開啟三印星門"></button><a class="hotspot warrior" data-cert="cert_warrior" href="../index.html" aria-label="前往勇者試煉城：打怪 RPG"></a></section></main>
<div class="cover" id="coverScreen" aria-label="遊戲封面，點擊開始"><img src="cover.png" alt="星印遠征：三印之門。點擊任何部位遊戲開始。"></div>
<div class="modal" id="gateModal" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="gateTitle"><button class="close" aria-label="關閉">×</button><h2 id="gateTitle">🔒 通關大門</h2><p>把背包中的憑證拖到正確的凹槽吧！</p><div class="slots" id="slots"></div><section class="backpack"><h3>🎒 背包欄</h3><div id="bag" class="bag"></div></section></section></div>
<div class="ending-modal" id="endingModal" aria-hidden="true"><section class="ending-scene" role="dialog" aria-modal="true" aria-label="冒險結局"><img id="endingImage" src="ending-01.png" alt="冒險結局插圖"><div class="ending-step" id="endingStep">1 / 5</div><div class="ending-copy"><div id="endingCaption"></div><button class="ending-next" id="endingNext">下一頁 ✦</button></div></section></div>
<div class="modal" id="completeModal" aria-hidden="true"><section class="dialog complete" role="dialog" aria-modal="true"><div class="trophy">🏆</div><h2>冒險完成！</h2><p>總冒險時長：<strong id="duration"></strong></p><button class="again" id="againBtn">再次冒險</button></section></div>
<script>
const certificates=[{key:'cert_dynasty',name:'朝代之印',label:'朝代',icon:'🎴'},{key:'cert_idiom',name:'成語之印',label:'成語',icon:'📝'},{key:'cert_warrior',name:'勇者之印',label:'勇者',icon:'⚔️'}],$=s=>document.querySelector(s);let placed=new Set(),touchBadge=null;
function owned(){return certificates.filter(c=>localStorage.getItem(c.key)==='true')}function updateMap(){const has=owned();if(!localStorage.getItem('adventure_start'))localStorage.setItem('adventure_start',Date.now());$('#count').textContent=has.length;document.querySelectorAll('[data-cert]').forEach(el=>el.classList.toggle('done',has.some(c=>c.key===el.dataset.cert)))}function openModal(id){$(id).classList.add('open');$(id).setAttribute('aria-hidden','false')}function closeModal(id){$(id).classList.remove('open');$(id).setAttribute('aria-hidden','true')}
function buildGate(){placed=new Set();const has=owned();$('#slots').innerHTML=certificates.map(c=>`<div class="slot" data-key="${c.key}"><span class="slot-label">${c.label}</span><span class="slot-empty">將「${c.name}」放入這裡</span></div>`).join('');$('#bag').innerHTML=has.length?has.map(c=>`<div class="badge" draggable="true" data-key="${c.key}">${c.icon} ${c.name}</div>`).join(''):'<p class="empty">背包裡還沒有憑證，先去挑戰關卡吧！</p>';bindDrag()}function put(badge,slot){const key=badge.dataset.key;if(slot.dataset.key===key&&!placed.has(key)){placed.add(key);slot.classList.add('correct');slot.innerHTML=`<span class="slot-label">${certificates.find(c=>c.key===key).label}</span><span class="badge" style="cursor:default">${badge.textContent}</span>`;badge.classList.add('used');if(placed.size===3)setTimeout(win,380)}else{slot.classList.add('wrong');badge.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260});setTimeout(()=>slot.classList.remove('wrong'),380)}}
function bindDrag(){document.querySelectorAll('.badge').forEach(b=>{b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',b.dataset.key));b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;touchBadge=b;const ghost=b.cloneNode(true);ghost.classList.add('dragging');ghost.id='dragGhost';document.body.append(ghost);moveGhost(e);b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(touchBadge===b)moveGhost(e)});b.addEventListener('pointerup',e=>{if(touchBadge!==b)return;$('#dragGhost')?.remove();const slot=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');if(slot)put(b,slot);touchBadge=null})});document.querySelectorAll('.slot').forEach(s=>{s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('over')});s.addEventListener('dragleave',()=>s.classList.remove('over'));s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');const b=document.querySelector(`.badge[data-key="${e.dataTransfer.getData('text/plain')}"]`);if(b)put(b,s)})})}function moveGhost(e){const g=$('#dragGhost');if(g){g.style.left=`${e.clientX+10}px`;g.style.top=`${e.clientY+10}px`}}
const endingSlides=[['ending-01.png','三印歸位，星門甦醒。'],['ending-02.png','知識，為勇氣指路。'],['ending-03.png','黑霧未散，心光未熄。'],['ending-04.png','每一次學會，都能照亮遠方。'],['ending-05.png','新的故事，正等你翻頁。']];let endingIndex=0;function showEnding(){const slide=endingSlides[endingIndex];$('#endingImage').src=slide[0];$('#endingImage').alt=`結局第 ${endingIndex+1} 幕：${slide[1]}`;$('#endingCaption').textContent=slide[1];$('#endingStep').textContent=`${endingIndex+1} / ${endingSlides.length}`;$('#endingNext').textContent=endingIndex===endingSlides.length-1?'查看冒險成果 ✦':'下一頁 ✦'}function playEnding(){endingIndex=0;showEnding();openModal('#endingModal')}function nextEnding(){if(endingIndex<endingSlides.length-1){endingIndex++;showEnding()}else{closeModal('#endingModal');openModal('#completeModal')}}function win(){closeModal('#gateModal');const start=Number(localStorage.getItem('adventure_start'))||Date.now(),seconds=Math.max(0,Math.floor((Date.now()-start)/1000));$('#duration').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')} 分 ${String(seconds%60).padStart(2,'0')} 秒`;playEnding()}function clearProgress(){certificates.forEach(c=>localStorage.removeItem(c.key));localStorage.removeItem('adventure_start');closeModal('#gateModal');updateMap()}function restartAdventure(){localStorage.clear();sessionStorage.clear();location.reload()}
$('#gateBtn').onclick=()=>{buildGate();openModal('#gateModal')};$('#clearProgress').onclick=()=>{if(confirm('確定要清除本次冒險的 3 個憑證與計時嗎？'))clearProgress()};$('#againBtn').onclick=restartAdventure;$('#endingNext').onclick=nextEnding;$('.close').onclick=()=>closeModal('#gateModal');document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m&&m.id==='gateModal')closeModal('#gateModal')}));const cover=$('#coverScreen');if(sessionStorage.getItem('adventure_cover_seen')==='true')cover.classList.add('hide');cover.addEventListener('click',()=>{sessionStorage.setItem('adventure_cover_seen','true');cover.classList.add('hide')});updateMap();
</script></body></html>
